<!DOCTYPE html>
<html>
<head>
    <title>AI Text Analyzer</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            padding: 50px;
        }
        input, button {
            padding: 10px;
            width: 300px;
            border-radius: 8px;
            border: none;
        }
        button {
            background: #00c6ff;
            color: black;
            cursor: pointer;
            margin-top: 10px;
        }
        .result {
            margin-top: 30px;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<h1>🚀 AI Text Analyzer</h1>

<form method="POST">
    <input type="text" name="text" placeholder="Enter text to analyze..." required>
    <br>
    <button type="submit">Analyze</button>
</form>

{% if result %}
<div class="result">
    <p><strong>Text:</strong> {{ result.text }}</p>
    <p><strong>Language:</strong> {{ result.language }}</p>
    <p><strong>Confidence:</strong> {{ result.confidence }}</p>
    <p><strong>Sentiment:</strong> {{ result.sentiment }}</p>
</div>
{% endif %}

</body>
</html>
